# ===========================
# Server
# ===========================
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===========================
# Firebase Configuration
# ===========================
# Credentials loaded from firebase-service-account.json in classpath
# firebase.project-id=${FIREBASE_PROJECT_ID}
# firebase.client-email=${FIREBASE_CLIENT_EMAIL}
# firebase.private-key=${FIREBASE_PRIVATE_KEY}
firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:}

# ===========================
# Actuator
# ===========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ===========================
# Jackson
# ===========================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ===========================
# Logging
# ===========================
logging.level.com.nexabank=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n
